name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows app
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w -H=windowsgui' -o /tmp/DuplicateGuard.exe .
      - name: Build Windows installer
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p installer/payload
          cp /tmp/DuplicateGuard.exe installer/payload/DuplicateGuard.exe
          cd installer
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o /tmp/DuplicateGuard_Setup.exe setup.go
